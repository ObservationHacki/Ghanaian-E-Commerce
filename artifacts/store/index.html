<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VBUY — Premium tech, fashion & home in Ghana</title>
    <meta
      name="description"
      content="Shop verified electronics, fashion, home and beauty with nationwide delivery across Ghana. Pay with MTN MoMo, Telecel Cash or card."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="VBUY — Premium tech, fashion & home in Ghana" />
    <meta
      property="og:description"
      content="Shop verified electronics, fashion, home and beauty with nationwide delivery across Ghana."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VBUY" />
    <meta
      name="twitter:description"
      content="Premium tech, fashion & home with nationwide delivery across Ghana."
    />
    <meta name="twitter:image" content="/og-default.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so the first frame never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('vbuy_theme');
          if (stored == null) {
            stored = localStorage.getItem('kumasi_theme');
            if (stored != null) {
              localStorage.setItem('vbuy_theme', stored);
              localStorage.removeItem('kumasi_theme');
            }
          }
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
