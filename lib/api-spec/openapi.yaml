openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VBUY — Premium Ghanaian E-Commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Product categories
  - name: brands
    description: Product brands
  - name: products
    description: Product catalogue
  - name: cart
    description: Shopping cart (session-based, supports guest)
  - name: orders
    description: Order management
  - name: addresses
    description: Delivery addresses
    description: Payment processing
  - name: content
    description: Public storefront content
  - name: admin
    description: Protected business operations APIs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Categories ──────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # ── Brands ──────────────────────────────────────────────────────────────────
  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all brands
      responses:
        "200":
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

  # ── Products ─────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters and pagination
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Category slug
        - name: brand
          in: query
          schema: { type: string }
          description: Brand slug
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular]
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Trending and featured products for homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get single product with variants and related products
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found

  /products/{id}/related:
    get:
      operationId: listRelatedProducts
      tags: [products]
      summary: Get related products for a given product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"

  # ── Cart ─────────────────────────────────────────────────────────────────────
  /cart/{sessionId}:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get cart by session ID
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear all items from cart
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Cart cleared

  /cart/{sessionId}/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add item to cart
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{sessionId}/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemPatch"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  # ── Orders ───────────────────────────────────────────────────────────────────
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (guest or authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID (guest via token or authenticated user)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found

  /orders/{id}/momo-reference:
    post:
      operationId: submitMomoReference
      tags: [orders]
      summary: Submit Mobile Money transaction reference for manual verification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MomoReferenceInput"
      responses:
        "200":
          description: Reference recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomoReferenceResponse"
        "400":
          description: Validation error
        "403":
          description: Forbidden
        "404":
          description: Order not found

  /users/me/orders:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: List all orders for the authenticated user
      responses:
        "200":
          description: User order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  # ── Addresses ────────────────────────────────────────────────────────────────
  /addresses:
    get:
      operationId: listAddresses
      tags: [addresses]
      summary: List saved addresses for authenticated user
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"

    post:
      operationId: createAddress
      tags: [addresses]
      summary: Save a delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /addresses/{id}:
    delete:
      operationId: deleteAddress
      tags: [addresses]
      summary: Delete a saved address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /content:
    get:
      operationId: listPublicContent
      tags: [content]
      summary: Published content blocks for the storefront
      responses:
        "200":
          description: Content blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicContentBlock"

  # ── Admin ───────────────────────────────────────────────────────────────────
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current admin profile and permissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Unauthorized
        "403":
          description: Not an admin

  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: inviteAdmin
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleId]
              properties:
                email: { type: string }
                roleId: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/admins/{id}:
    patch:
      operationId: updateAdmin
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: integer }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/roles:
    get:
      operationId: listRoles
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Roles and permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"

  /admin/roles/{id}:
    patch:
      operationId: updateRolePermissions
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: paymentStatus
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderListResponse"

  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                paymentStatus: { type: string }
                note: { type: string }
                carrier: { type: ["string", "null"] }
                trackingNumber: { type: ["string", "null"] }
                trackingUrl: { type: ["string", "null"] }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"

  /admin/orders/{id}/notes:
    post:
      operationId: addAdminOrderNote
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNote"

  /admin/orders/{id}/verify-payment:
    post:
      operationId: verifyAdminOrderPayment
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Verify a submitted Mobile Money payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyMomoPaymentResponse"
        "400":
          description: Order not eligible for verification
        "404":
          description: Order not found

  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createAdminCategory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    patch:
      operationId: updateAdminCategory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteAdminCategory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/brands:
    get:
      operationId: listAdminBrands
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createAdminBrand
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

  /admin/brands/{id}:
    patch:
      operationId: updateAdminBrand
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
    delete:
      operationId: deleteAdminBrand
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: published
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
    post:
      operationId: createAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"

  /admin/products/bulk:
    post:
      operationId: bulkUpdateAdminProducts
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer }
                      basePrice: { type: number }
                      featured: { type: boolean }
                      published: { type: boolean }
                      compareAtPrice: { type: ["number", "null"] }
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }

  /admin/products/{id}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "409":
          description: Product is referenced by existing orders
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  orderItemCount: { type: integer }

  /admin/inventory:
    get:
      operationId: listAdminInventory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: lowStock
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Inventory rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRow"

  /admin/inventory/{variantId}:
    patch:
      operationId: updateAdminInventory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockCount]
              properties:
                stockCount: { type: integer }
      responses:
        "200":
          description: Updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"

  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomerListResponse"

  /admin/customers/{userId}:
    get:
      operationId: getAdminCustomer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomerDetail"
    patch:
      operationId: updateAdminCustomer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, flagged, disabled] }
                email: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [userId, status]
                properties:
                  userId: { type: string }
                  email: { type: ["string", "null"] }
                  status: { type: string }

  /admin/customers/{userId}/notes:
    post:
      operationId: addAdminCustomerNote
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNote"

  /admin/analytics/summary:
    get:
      operationId: getAdminAnalyticsSummary
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /admin/analytics/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"

  /admin/content:
    get:
      operationId: listAdminContent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Content blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentBlock"
    post:
      operationId: createAdminContent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentBlock"

  /admin/content/{id}:
    patch:
      operationId: updateAdminContent
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentBlockInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentBlock"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Category:
      type: object
      properties:
        id:           { type: integer }
        name:         { type: string }
        slug:         { type: string }
        productCount: { type: integer }
      required: [id, name, slug, productCount]

    Brand:
      type: object
      properties:
        id:   { type: integer }
        name: { type: string }
        slug: { type: string }
      required: [id, name, slug]

    ProductImageAsset:
      type: object
      properties:
        primaryImage: { type: string }
        thumbnail:    { type: string }
        largePath:    { type: string }
        mediumPath:   { type: string }
        width:        { type: integer }
        height:       { type: integer }
        verified:     { type: boolean }
      required: [primaryImage, thumbnail, largePath, mediumPath]

    ProductSummary:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        basePrice:   { type: number }
        images:
          type: array
          items: { type: string }
        imageAssets:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageAsset"
        categoryId:  { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        brandId:     { type: ["integer", "null"] }
        brandName:   { type: ["string", "null"] }
        inStock:     { type: boolean }
        variantCount: { type: integer }
      required: [id, name, description, basePrice, images, inStock, variantCount]

    ProductVariant:
      type: object
      properties:
        id:         { type: integer }
        name:       { type: string }
        sku:        { type: string }
        price:      { type: number }
        stockCount: { type: integer }
        attributes:
          type: object
          properties:
            color:   { type: ["string", "null"] }
            size:    { type: ["string", "null"] }
            storage: { type: ["string", "null"] }
            ram:     { type: ["string", "null"] }
            variant: { type: ["string", "null"] }
      required: [id, name, sku, price, stockCount]

    ProductDetail:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        basePrice:   { type: number }
        images:
          type: array
          items: { type: string }
        imageAssets:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageAsset"
        categoryId:  { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        brandId:     { type: ["integer", "null"] }
        brandName:   { type: ["string", "null"] }
        inStock:     { type: boolean }
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
      required: [id, name, description, basePrice, images, inStock, variants]

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        total:      { type: integer }
        page:       { type: integer }
        totalPages: { type: integer }
      required: [products, total, page, totalPages]

    CartItem:
      type: object
      properties:
        id:               { type: integer }
        productVariantId: { type: integer }
        quantity:         { type: integer }
        unitPrice:        { type: number }
        productId:        { type: integer }
        productName:      { type: string }
        productImage:     { type: ["string", "null"] }
        variantName:      { type: string }
        variantSku:       { type: string }
        stockCount:       { type: integer }
      required: [id, productVariantId, quantity, unitPrice, productId, productName, variantName, variantSku, stockCount]

    Cart:
      type: object
      properties:
        sessionId: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:     { type: number }
        itemCount: { type: integer }
      required: [sessionId, items, total, itemCount]

    CartItemInput:
      type: object
      properties:
        productVariantId: { type: integer }
        quantity:         { type: integer }
      required: [productVariantId, quantity]

    CartItemPatch:
      type: object
      properties:
        quantity: { type: integer }
      required: [quantity]

    Address:
      type: object
      properties:
        id:             { type: integer }
        digitalAddress: { type: string }
        region:         { type: string }
        district:       { type: string }
        notes:          { type: ["string", "null"] }
        userId:         { type: ["string", "null"] }
      required: [id, digitalAddress, region, district]

    AddressInput:
      type: object
      properties:
        digitalAddress: { type: string }
        region:         { type: string }
        district:       { type: string }
        notes:          { type: string }
        userId:         { type: string }
      required: [digitalAddress, region, district]

    OrderItem:
      type: object
      properties:
        id:               { type: integer }
        productVariantId: { type: integer }
        quantity:         { type: integer }
        unitPrice:        { type: number }
        productName:      { type: string }
        productImage:     { type: ["string", "null"] }
        variantName:      { type: string }
      required: [id, productVariantId, quantity, unitPrice, productName, variantName]

    Order:
      type: object
      properties:
        id:            { type: integer }
        status:        { type: string }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        total:         { type: number }
        deliveryFee:   { type: number }
        deliveryRegion:
          type: ["string", "null"]
          description: Snapshot zone — accra | outside_accra
        userId:        { type: ["string", "null"] }
        carrier:       { type: ["string", "null"] }
        trackingNumber: { type: ["string", "null"] }
        trackingUrl:   { type: ["string", "null"] }
        momoReference: { type: ["string", "null"] }
        paymentSubmittedAt: { type: ["string", "null"] }
        paymentVerifiedAt: { type: ["string", "null"] }
        createdAt:     { type: string }
        address:
          $ref: "#/components/schemas/Address"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [id, status, paymentMethod, paymentStatus, total, deliveryFee, createdAt, items]

    OrderInput:
      type: object
      properties:
        sessionId:
          type: string
        address:
          $ref: "#/components/schemas/AddressInput"
        paymentMethod:
          type: string
          enum: [momo_manual]
        deliveryZone:
          type: string
          enum: [accra, outside_accra]
          description: Flat delivery fee zone selected at checkout
        userId:
          type: string
        turnstileToken:
          type: string
          minLength: 1
          description: Cloudflare Turnstile token (required when TURNSTILE_SECRET_KEY is set)
      required: [sessionId, address, paymentMethod, deliveryZone, turnstileToken]

    MomoReferenceInput:
      type: object
      properties:
        momoReference: { type: string, minLength: 3 }
        turnstileToken:
          type: string
          minLength: 1
          description: Cloudflare Turnstile token (required when TURNSTILE_SECRET_KEY is set)
      required: [momoReference, turnstileToken]

    MomoReferenceResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        duplicateReference: { type: boolean }
      required: [order, duplicateReference]

    VerifyMomoPaymentResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/AdminOrderDetail"
        duplicateReference: { type: boolean }
        warning:
          type: ["string", "null"]
      required: [order, duplicateReference]

    PublicContentBlock:
      type: object
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: ["string", "null"] }
        ctaLabel: { type: ["string", "null"] }
        ctaHref: { type: ["string", "null"] }
        sortOrder: { type: integer }
      required: [key, title, body, sortOrder]

    AdminMe:
      type: object
      properties:
        id: { type: integer }
        userId: { type: string }
        email: { type: string }
        roleId: { type: integer }
        roleSlug: { type: string }
        permissions:
          type: array
          items: { type: string }
      required: [id, userId, email, roleId, roleSlug, permissions]

    AdminUser:
      type: object
      properties:
        id: { type: integer }
        userId: { type: string }
        email: { type: string }
        roleId: { type: integer }
        status: { type: string }
        createdAt: { type: string }
        roleName: { type: string }
        roleSlug: { type: string }
      required: [id, userId, email, roleId, status, createdAt, roleName, roleSlug]

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        permissionCodes:
          type: array
          items: { type: string }
      required: [id, name, slug, permissionCodes]

    Permission:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        description: { type: string }
      required: [id, code, description]

    RolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required: [roles, permissions]

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        actorUserId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: ["string", "null"] }
        metadata: { type: object }
        createdAt: { type: string }
      required: [id, actorUserId, action, resourceType, createdAt]

    AdminOrderSummary:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        total: { type: number }
        userId: { type: ["string", "null"] }
        carrier: { type: ["string", "null"] }
        trackingNumber: { type: ["string", "null"] }
        momoReference: { type: ["string", "null"] }
        paymentSubmittedAt: { type: ["string", "null"] }
        duplicateMomoReference: { type: boolean }
        createdAt: { type: string }
        region: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
      required: [id, status, paymentMethod, paymentStatus, total, createdAt, duplicateMomoReference]

    AdminOrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderSummary"
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [orders, total, page, totalPages]

    AdminNote:
      type: object
      properties:
        id: { type: integer }
        authorUserId: { type: string }
        body: { type: string }
        createdAt: { type: string }
      required: [id, authorUserId, body, createdAt]

    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            duplicateMomoReference: { type: boolean }
            notes:
              type: array
              items:
                $ref: "#/components/schemas/AdminNote"
            history:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  fromStatus: { type: ["string", "null"] }
                  toStatus: { type: string }
                  actorUserId: { type: ["string", "null"] }
                  note: { type: ["string", "null"] }
                  createdAt: { type: string }
                required: [id, toStatus, createdAt]

    AdminProductSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        basePrice: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        images:
          type: array
          items: { type: string }
        featured: { type: boolean }
        published: { type: boolean }
        categoryId: { type: ["integer", "null"] }
        brandId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        brandName: { type: ["string", "null"] }
        stockTotal: { type: integer }
        variantCount: { type: integer }
      required: [id, name, description, basePrice, featured, published, stockTotal, variantCount]

    AdminProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminProductSummary"
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [products, total, page, totalPages]

    AdminProductInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        categoryId: { type: ["integer", "null"] }
        brandId: { type: ["integer", "null"] }
        basePrice: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        images:
          type: array
          items: { type: string }
        featured: { type: boolean }
        published: { type: boolean }
        externalId: { type: ["string", "null"] }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              sku: { type: string }
              price: { type: number }
              stockCount: { type: integer }
              attributes: { type: object }

    AdminProductDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        basePrice: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        images:
          type: array
          items: { type: string }
        featured: { type: boolean }
        published: { type: boolean }
        categoryId: { type: ["integer", "null"] }
        brandId: { type: ["integer", "null"] }
        externalId: { type: ["string", "null"] }
        createdAt: { type: string }
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
      required: [id, name, description, basePrice, featured, published, variants]

    InventoryRow:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        variantName: { type: string }
        sku: { type: string }
        price: { type: number }
        stockCount: { type: integer }
      required: [id, productId, productName, variantName, sku, price, stockCount]

    AdminCustomerSummary:
      type: object
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        status: { type: string }
        orderCount: { type: integer }
        totalSpent: { type: number }
        lastOrderAt: { type: ["string", "null"] }
      required: [userId, status, orderCount, totalSpent]

    AdminCustomerListResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomerSummary"
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [customers, total, page, totalPages]

    AdminCustomerDetail:
      type: object
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        status: { type: string }
        orderCount: { type: integer }
        totalSpent: { type: number }
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderSummary"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/AdminNote"
      required: [userId, status, orderCount, totalSpent, orders, addresses, notes]

    AnalyticsSummary:
      type: object
      properties:
        orderCount: { type: integer }
        revenue: { type: number }
        aov: { type: number }
        byStatus:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
        byRegion:
          type: array
          items:
            type: object
            properties:
              region: { type: string }
              count: { type: integer }
              revenue: { type: number }
        bestsellers:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer }
              productName: { type: string }
              unitsSold: { type: integer }
              revenue: { type: number }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              orderCount: { type: integer }
              revenue: { type: number }
      required: [orderCount, revenue, aov, byStatus, byRegion, bestsellers, daily]

    DashboardMetrics:
      type: object
      properties:
        totalOrders: { type: integer }
        revenue: { type: number }
        pendingOrders: { type: integer }
        productCount: { type: integer }
        unpublishedProducts: { type: integer }
        lowStockVariants: { type: integer }
      required: [totalOrders, revenue, pendingOrders, productCount, unpublishedProducts, lowStockVariants]

    ContentBlock:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: ["string", "null"] }
        ctaLabel: { type: ["string", "null"] }
        ctaHref: { type: ["string", "null"] }
        sortOrder: { type: integer }
        published: { type: boolean }
        updatedAt: { type: string }
      required: [id, key, title, body, sortOrder, published, updatedAt]

    ContentBlockInput:
      type: object
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: ["string", "null"] }
        ctaLabel: { type: ["string", "null"] }
        ctaHref: { type: ["string", "null"] }
        sortOrder: { type: integer }
        published: { type: boolean }
